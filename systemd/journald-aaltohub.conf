# AaltoHub v2 journald configuration
#
# Purpose: Prevent systemd journal from filling disk space
# Location: /etc/systemd/journald.conf.d/aaltohub.conf
#
# Installation:
#   sudo cp systemd/journald-aaltohub.conf /etc/systemd/journald.conf.d/
#   sudo systemctl restart systemd-journald
#
# Verification:
#   journalctl --disk-usage
#   journalctl -u aaltohub-api -n 100
#   journalctl -u aaltohub-live-crawler -n 100

[Journal]
# Maximum disk space for journal files (default: 10% of filesystem)
SystemMaxUse=1G

# Maximum time to retain journal entries
MaxRetentionSec=7day

# Compress journal files to save space
Compress=yes

# Forward to syslog (optional, disable if not using syslog)
ForwardToSyslog=no

# Maximum size per journal file (before rotation)
SystemMaxFileSize=100M

# How aggressively to rate-limit identical log lines
# Format: burst_count/interval (e.g. 1000/30s = 1000 identical lines in 30s)
RateLimitIntervalSec=30s
RateLimitBurst=1000
